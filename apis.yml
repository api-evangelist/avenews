aid: avenews
name: Avenews
description: >-
  Avenews (Avenews-GT) is a Nairobi-based agri-fintech and Digital Credit Provider licensed by the
  Central Bank of Kenya that delivers transaction-backed, recurring working-capital financing to
  agricultural SMEs across Kenya. Rather than requiring traditional collateral, Avenews underwrites
  using digital trade data, M-Pesa and bank statements, and supply-chain history. Its products
  include the Agri Credit Line (recurring capital to restock inputs), Agri Supplier Financing
  (invoice financing), Agri Buyer Financing (deferred-payment terms), and Stockist Financing (direct
  distributor payments). The public site is built on Wix and exposes a Wix Site MCP endpoint plus an
  llms.txt file for agentic AI access, though Avenews does not publish a bespoke developer API,
  OpenAPI definition, or developer portal. This profile was surfaced as a Techstars-connected
  portfolio lead and enriched by the API Evangelist pipeline.
